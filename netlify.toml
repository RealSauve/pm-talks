# PM Talks is a fully static Next.js export (see next.config.ts), so the build
# writes plain HTML/CSS/JS to `out/`. No Netlify runtime or adapter is needed.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Hashed build assets never change between deploys.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media can be cached for a week; filenames are stable, not hashed.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
