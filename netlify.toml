# PM Talks is a fully static Next.js export (see next.config.ts).
# The Netlify Next plugin detects `output: "export"`, copies `out/` into the
# deployment, and publishes it. It still expects `.next` as the publish dir.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Hashed build assets never change between deploys.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media can be cached for a week; filenames are stable, not hashed.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
